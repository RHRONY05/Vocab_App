<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>M06 · Review — multiple choice (answered right)</title>
<meta name="viewport" content="width=390">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../ui.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../mock.js"></script>
</head>
<body>
<div class="frame-m">
  <!-- In a session the tab bar is hidden; the header shows progress + close -->
  <header class="m-header" style="gap: 12px;">
    <button class="icon-btn" aria-label="End session"><i data-lucide="x"></i></button>
    <div class="grow bar"><i style="width: 57%"></i></div>
    <span class="hint num" style="font-weight:600;">4 / 7</span>
  </header>

  <main style="padding: 22px 16px 16px;" class="col">
    <span class="label qkind"><i data-lucide="list-checks" class="i-sm"></i>Meaning</span>
    <p class="prompt" style="font-size: 20px; line-height: 28px; margin: 10px 0 20px;">In machine learning, what does <b>inference</b> mean?</p>

    <div class="options" style="gap: 8px;">
      <button class="option dim" style="font-size:15px; min-height:52px;"><span class="key">1</span><span>Collecting more training data</span><span></span></button>
      <button class="option correct" style="font-size:15px; min-height:52px;"><span class="key">2</span><span>Using a trained model to make predictions on new data</span><i data-lucide="check" class="mk"></i></button>
      <button class="option dim" style="font-size:15px; min-height:52px;"><span class="key">3</span><span>Checking the model for errors in its code</span><span></span></button>
      <button class="option dim" style="font-size:15px; min-height:52px;"><span class="key">4</span><span>Making the model's file size smaller</span><span></span></button>
    </div>

    <div class="explain" style="margin-top: 14px; font-size: 14px; line-height: 21px;">
      <b>Inference</b> is the step after training: the model reaches conclusions (predictions) from new input, just like a person infers from evidence.
    </div>

    <div style="margin-top: auto; padding-top: 16px;">
      <button class="btn btn-primary btn-lg btn-block">Next</button>
    </div>
  </main>
</div>
</body>
</html>
