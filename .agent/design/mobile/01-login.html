<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>M01 · Login</title>
<meta name="viewport" content="width=390">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../ui.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../mock.js"></script>
</head>
<body>
<div class="frame-m" style="justify-content:center; padding: 0 16px;">
  <div class="decor" aria-hidden="true"><svg class="tr"><use href="../illustrations/sprite.svg#decor-tr"/></svg><svg class="bl"><use href="../illustrations/sprite.svg#decor-bl"/></svg></div>

  <div class="col" style="align-items:center; gap: 12px; margin-bottom: 28px;">
    <svg class="illus sm" aria-hidden="true"><use href="../illustrations/sprite.svg#book-sprout"/></svg>
    <h1 class="serif" style="font-size: 30px; line-height: 36px;">Vocab</h1>
    <p class="hint">Sign in to continue</p>
  </div>
  <form class="col" style="gap: 16px;">
    <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" placeholder="you@example.com"></div>
    <div class="field"><label for="pw">Password</label><input class="input" id="pw" type="password" value="••••••••••••"></div>
    <div class="banner banner-danger"><i data-lucide="circle-alert" class="i-sm"></i><span>Wrong email or password. Try again.</span></div>
    <button class="btn btn-primary btn-lg btn-block">Sign in</button>
  </form>
</div>
</body>
</html>
