<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>D08 · Review — session finished</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../ui.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../mock.js"></script>
</head>
<body>
<div class="frame-d">
  <div class="decor" aria-hidden="true"><svg class="tr"><use href="../illustrations/sprite.svg#decor-tr"/></svg><svg class="bl"><use href="../illustrations/sprite.svg#decor-bl"/></svg></div>

  <header class="topbar">
    <div class="side"><div class="brand"><svg class="logo" aria-hidden="true"><use href="../illustrations/sprite.svg#logo"/></svg>Vocab</div></div>
    <nav class="tabs" aria-label="Main">
      <button class="tab"><i data-lucide="book-open"></i>Learn</button>
      <button class="tab"><i data-lucide="library"></i>Words</button>
      <button class="tab on"><i data-lucide="repeat-2"></i>Review</button>
    </nav>
    <div class="side end">
      <button class="icon-btn" aria-label="Keyboard shortcuts"><i data-lucide="keyboard"></i></button>
      <button class="icon-btn" aria-label="Account menu"><span class="avatar">R</span></button>
    </div>
  </header>

  <main style="padding: 48px 24px;">
    <div class="col" style="max-width: 560px; margin: 0 auto; gap: 22px; align-items:center; text-align:center;">
      <svg class="illus " aria-hidden="true"><use href="../illustrations/sprite.svg#caught-up"/></svg>
      <div>
        <div class="serif num" style="font-size: var(--text-hero); line-height: var(--leading-hero); font-weight: 600;">5 <span style="color: var(--ink-3); font-weight: 500;">/ 7</span></div>
        <p class="muted" style="font-size: 16px; margin-top: 6px;">Nice work. 4 words moved up, 1 reached Mastered.</p>
      </div>

      <section class="card" style="width: 100%; padding: 8px; text-align:left;">
        <div class="label" style="padding: 10px 14px 4px;">Missed · back tomorrow</div>
        <a class="wrow" style="text-decoration:none; color:inherit;"><span class="dot learning"></span>
          <div class="grow"><div class="w">sustainable<span class="pos">adj</span></div><div class="m">Able to continue for a long time without harm</div></div>
          <i data-lucide="chevron-right" class="i-sm" style="color:var(--ink-3)"></i></a>
        <a class="wrow" style="text-decoration:none; color:inherit;"><span class="dot learning"></span>
          <div class="grow"><div class="w">augmentation<span class="pos">noun</span></div><div class="m">The act of making something bigger or better</div></div>
          <i data-lucide="chevron-right" class="i-sm" style="color:var(--ink-3)"></i></a>
      </section>

      <div class="col" style="gap: 10px; width: 100%;">
        <p class="hint" style="font-size: 14px;">All caught up for today. Next review: tomorrow, 5 words.</p>
        <div class="row" style="gap: 10px;">
          <button class="btn btn-primary btn-lg grow">Practice more <kbd>Enter</kbd></button>
          <button class="btn btn-secondary btn-lg grow">Back to Learn</button>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
