<svg xmlns="http://www.w3.org/2000/svg">
<!--
  Vocab illustration sprite. Line art (2px ink stroke) + soft washes.
  Colours come from the design tokens through inline style attributes, so they follow light/dark.
  In the app, turn each <symbol> into a React component (inline SVG, aria-hidden).
-->

  <!-- reusable sparkle (4-point star), centred on 0,0 -->
  <symbol id="spark" viewBox="-9 -9 18 18">
    <path d="M0 -8 C1 -2 2 -1 8 0 C2 1 1 2 0 8 C-1 2 -2 1 -8 0 C-2 -1 -1 -2 0 -8Z" style="fill:var(--highlight)"/>
  </symbol>

  <!-- Brand mark: open book with a sprout, on a teal tile -->
  <symbol id="logo" viewBox="0 0 32 32">
    <rect x="0" y="0" width="32" height="32" rx="9" style="fill:var(--accent)"/>
    <path d="M7 12.5 C10 11.5 13.5 12 16 13.6 C18.5 12 22 11.5 25 12.5 L25 23 C22 22 18.5 22.5 16 24 C13.5 22.5 10 22 7 23 Z" style="fill:none;stroke:var(--accent-ink);stroke-width:1.7;stroke-linejoin:round"/>
    <path d="M16 13.6 V24" style="fill:none;stroke:var(--accent-ink);stroke-width:1.7"/>
    <path d="M16 13.4 C16 10.5 17 8.6 19.2 7.6" style="fill:none;stroke:var(--accent-ink);stroke-width:1.5;stroke-linecap:round"/>
    <path d="M19.2 7.6 C21.3 6.9 23.2 7.7 23.6 9.4 C21.6 10.2 19.8 9.4 19.2 7.6Z" style="fill:var(--highlight)"/>
  </symbol>

  <!-- Hero: open book with a sprout and floating letters (Learn empty, login) -->
  <symbol id="book-sprout" viewBox="0 0 240 180">
    <path d="M34 118 C24 70 78 26 136 34 C196 42 230 88 212 132 C198 166 132 176 84 164 C56 157 40 142 34 118Z" style="fill:var(--illus-blob-b)"/>
    <circle cx="198" cy="54" r="18" style="fill:var(--illus-blob-a)"/>
    <!-- cover -->
    <path d="M36 74 L36 154 C70 148 100 150 120 162 C140 150 170 148 204 154 L204 74 L196 74 L196 146 C170 140 140 142 120 154 C100 142 70 140 44 146 L44 74 Z" style="fill:var(--accent);stroke:var(--illus-line);stroke-width:2;stroke-linejoin:round"/>
    <!-- pages -->
    <path d="M120 76 C100 64 70 62 44 68 L44 146 C70 140 100 142 120 154 Z" style="fill:var(--illus-fill);stroke:var(--illus-line);stroke-width:2;stroke-linejoin:round"/>
    <path d="M120 76 C140 64 170 62 196 68 L196 146 C170 140 140 142 120 154 Z" style="fill:var(--illus-fill);stroke:var(--illus-line);stroke-width:2;stroke-linejoin:round"/>
    <!-- highlighted word on the right page -->
    <path d="M140 100 C150 97.5 160 97.5 172 99.5" style="fill:none;stroke:var(--highlight);stroke-width:8;stroke-linecap:round;opacity:.55"/>
    <!-- text lines -->
    <g style="fill:none;stroke:var(--illus-line);stroke-width:1.8;stroke-linecap:round;opacity:.38">
      <path d="M58 86 C72 82 90 82 106 87"/>
      <path d="M58 100 C72 96 90 96 106 101"/>
      <path d="M58 114 C72 110 86 110 98 114"/>
      <path d="M58 128 C70 124 80 124 90 127"/>
      <path d="M134 87 C150 82 168 82 182 86"/>
      <path d="M134 101 C150 96 168 96 182 100"/>
      <path d="M134 115 C150 110 164 110 176 113"/>
      <path d="M134 129 C146 124 156 124 166 126"/>
    </g>
    <!-- sprout -->
    <path d="M120 76 C119 62 121 52 120 40" style="fill:none;stroke:var(--illus-line);stroke-width:2;stroke-linecap:round"/>
    <path d="M120 60 C106 60 96 50 98 40 C110 40 120 48 120 60Z" style="fill:var(--illus-leaf);stroke:var(--illus-line);stroke-width:2;stroke-linejoin:round"/>
    <path d="M120 49 C132 49 144 39 142 27 C130 27 120 37 120 49Z" style="fill:var(--illus-leaf);stroke:var(--illus-line);stroke-width:2;stroke-linejoin:round"/>
    <!-- letters -->
    <text x="58" y="52" style="font-family:var(--font-serif);font-style:italic;font-weight:600;font-size:28px;fill:var(--accent-text)">a</text>
    <text x="164" y="40" style="font-family:var(--font-bn);font-weight:600;font-size:24px;fill:var(--highlight-text)">অ</text>
    <use href="#spark" x="76" y="20" width="16" height="16"/>
    <use href="#spark" x="204" y="96" width="18" height="18"/>
    <use href="#spark" x="22" y="90" width="12" height="12"/>
  </symbol>

  <!-- All caught up: stacked books, a cup of tea, a check badge -->
  <symbol id="caught-up" viewBox="0 0 240 180">
    <path d="M30 120 C26 74 70 40 124 42 C182 44 222 82 214 126 C206 162 150 172 98 166 C60 162 34 150 30 120Z" style="fill:var(--illus-blob-a)"/>
    <path d="M28 156 H214" style="fill:none;stroke:var(--illus-line);stroke-width:2;stroke-linecap:round;opacity:.35"/>
    <!-- books -->
    <rect x="48" y="130" width="128" height="26" rx="5" style="fill:var(--accent);stroke:var(--illus-line);stroke-width:2"/>
    <path d="M160 135 V151" style="fill:none;stroke:var(--accent-ink);stroke-width:2;stroke-linecap:round;opacity:.7"/>
    <rect x="58" y="106" width="112" height="24" rx="5" style="fill:var(--highlight);stroke:var(--illus-line);stroke-width:2"/>
    <path d="M70 118 H118" style="fill:none;stroke:var(--illus-line);stroke-width:2;stroke-linecap:round;opacity:.35"/>
    <rect x="52" y="82" width="120" height="24" rx="5" style="fill:var(--illus-fill);stroke:var(--illus-line);stroke-width:2"/>
    <path d="M64 94 H124" style="fill:none;stroke:var(--illus-line);stroke-width:2;stroke-linecap:round;opacity:.35"/>
    <path d="M150 106 L150 121 L155 116 L160 121 L160 106" style="fill:var(--danger);stroke:var(--illus-line);stroke-width:1.6;stroke-linejoin:round"/>
    <!-- tea -->
    <path d="M182 118 H210 V146 C210 152 206 156 200 156 H192 C186 156 182 152 182 146 Z" style="fill:var(--illus-fill);stroke:var(--illus-line);stroke-width:2;stroke-linejoin:round"/>
    <path d="M210 126 C219 126 219 142 210 142" style="fill:none;stroke:var(--illus-line);stroke-width:2;stroke-linecap:round"/>
    <path d="M182 128 H210" style="fill:none;stroke:var(--highlight);stroke-width:3;opacity:.7"/>
    <g style="fill:none;stroke:var(--illus-line);stroke-width:2;stroke-linecap:round;opacity:.45">
      <path d="M190 110 C186 104 194 100 190 92"/>
      <path d="M202 110 C198 104 206 100 202 92"/>
    </g>
    <!-- check -->
    <circle cx="76" cy="54" r="17" style="fill:var(--success);stroke:var(--illus-line);stroke-width:2"/>
    <path d="M68 54 L74 60 L85 48" style="fill:none;stroke:#FFFFFF;stroke-width:3;stroke-linecap:round;stroke-linejoin:round"/>
    <use href="#spark" x="104" y="30" width="16" height="16"/>
    <use href="#spark" x="190" y="54" width="18" height="18"/>
    <use href="#spark" x="30" y="84" width="12" height="12"/>
  </symbol>

  <!-- Margin decoration, top-right corner of the page -->
  <symbol id="decor-tr" viewBox="0 0 420 320">
    <path d="M420 0 V236 C372 262 318 244 292 204 C268 166 300 128 270 92 C246 62 262 18 300 0 Z" style="fill:var(--illus-blob-a)"/>
    <circle cx="226" cy="36" r="14" style="fill:var(--illus-blob-b)"/>
    <path d="M110 28 C186 4 262 40 282 124" style="fill:none;stroke:var(--illus-line);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:0.1 10;opacity:.35"/>
    <text x="304" y="118" style="font-family:var(--font-serif);font-style:italic;font-weight:600;font-size:46px;fill:var(--accent-text);opacity:.5">Aa</text>
    <path d="M330 262 C345 232 356 210 382 186" style="fill:none;stroke:var(--illus-line);stroke-width:1.8;stroke-linecap:round;opacity:.7"/>
    <g style="fill:var(--illus-leaf);stroke:var(--illus-line);stroke-width:1.6;stroke-linejoin:round;opacity:.8">
      <path d="M345 233 C333 229 326 217 330 207 C342 209 348 221 345 233Z"/>
      <path d="M357 214 C367 206 381 206 387 212 C379 222 365 222 357 214Z"/>
      <path d="M369 199 C365 188 369 176 377 172 C383 182 379 194 369 199Z"/>
    </g>
    <use href="#spark" x="240" y="140" width="18" height="18"/>
    <use href="#spark" x="384" y="28" width="14" height="14"/>
    <use href="#spark" x="150" y="54" width="11" height="11"/>
  </symbol>

  <!-- Margin decoration, bottom-left corner of the page -->
  <symbol id="decor-bl" viewBox="0 0 380 300">
    <path d="M0 300 V70 C44 52 100 76 112 128 C122 172 168 186 214 220 C244 244 240 286 214 300 Z" style="fill:var(--illus-blob-b)"/>
    <circle cx="176" cy="140" r="10" style="fill:var(--illus-blob-a)"/>
    <path d="M150 292 C172 232 232 200 304 212" style="fill:none;stroke:var(--illus-line);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:0.1 10;opacity:.35"/>
    <path d="M30 168 C44 162 58 162 70 168 C82 162 96 162 110 168 V206 C96 200 82 200 70 206 C58 200 44 200 30 206 Z" style="fill:var(--illus-fill);stroke:var(--illus-line);stroke-width:1.8;stroke-linejoin:round;opacity:.9"/>
    <path d="M70 168 V206" style="fill:none;stroke:var(--illus-line);stroke-width:1.8;opacity:.9"/>
    <g style="fill:none;stroke:var(--illus-line);stroke-width:1.5;stroke-linecap:round;opacity:.3">
      <path d="M38 178 C46 175 54 175 62 178"/><path d="M38 188 C46 185 54 185 62 188"/>
      <path d="M78 178 C86 175 94 175 102 178"/><path d="M78 188 C86 185 94 185 100 187"/>
    </g>
    <path d="M36 248 q10 -8 20 0 t20 0 t20 0 t20 0" style="fill:none;stroke:var(--highlight);stroke-width:3;stroke-linecap:round"/>
    <text x="134" y="262" style="font-family:var(--font-bn);font-weight:600;font-size:34px;fill:var(--accent-text);opacity:.45">শ</text>
    <use href="#spark" x="122" y="72" width="16" height="16"/>
    <use href="#spark" x="18" y="34" width="12" height="12"/>
    <use href="#spark" x="244" y="254" width="14" height="14"/>
  </symbol>
</svg>
