<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Illustrations</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../ui.css">
<script src="../mock.js"></script>
<style>
  .wrap { display: flex; flex-wrap: wrap; gap: 24px; padding: 32px; align-items: flex-start; }
  .box { background: var(--bg); border: 1px dashed var(--line-strong); border-radius: 16px; padding: 16px; }
  .box p { font-size: 12px; color: var(--ink-3); margin-top: 8px; font-family: var(--font-mono); }
</style>
</head>
<body>
<div class="wrap">
  <div class="box"><svg class="logo" style="width:64px;height:64px"><use href="sprite.svg#logo"/></svg><p>#logo</p></div>
  <div class="box"><svg class="illus"><use href="sprite.svg#book-sprout"/></svg><p>#book-sprout</p></div>
  <div class="box"><svg class="illus"><use href="sprite.svg#caught-up"/></svg><p>#caught-up</p></div>
  <div class="box"><svg style="width:420px;height:320px;display:block"><use href="sprite.svg#decor-tr"/></svg><p>#decor-tr</p></div>
  <div class="box"><svg style="width:380px;height:300px;display:block"><use href="sprite.svg#decor-bl"/></svg><p>#decor-bl</p></div>
</div>
</body>
</html>
